<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AeroNav</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f6f9;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:1px solid #e5e7eb;height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:16px}.logo span{color:#d97706}
main{flex:1;padding:20px 16px;display:flex;justify-content:center}
.dash{width:100%;max-width:620px;display:flex;flex-direction:column;gap:10px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 20px}
.row{display:flex;align-items:center;justify-content:space-between}
.av{width:38px;height:38px;border-radius:50%;background:#1a1a2e;color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uname{font-weight:500;font-size:14px}.uemail{font-size:12px;color:#6b7280;margin-top:1px}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:100px;padding:4px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:#16a34a}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.fi{padding:0 14px}.fi:not(:last-child){border-right:1px solid #e5e7eb}
.fl{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px}
.fv{font-size:16px;font-weight:500;margin-top:3px}.fv.a{color:#d97706}.fv.g{font-size:13px;color:#16a34a}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;cursor:pointer;transition:border-color 140ms,background 140ms}
.mc:hover{border-color:#1a1a2e;background:#f9fafb}
.mi{font-size:20px;margin-bottom:6px}.mn{font-size:12px;font-weight:500}.md{font-size:11px;color:#9ca3af;margin-top:2px}
.tag{display:inline-block;margin-top:6px;font-size:10px;padding:2px 6px;border-radius:4px}
.tag.l{background:#f0fdf4;color:#16a34a}.tag.a{background:#fffbeb;color:#d97706}.tag.n{background:#eff6ff;color:#2563eb}
.back-btn{background:none;border:none;color:#6b7280;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;padding:0;margin-bottom:12px}
.nav-btn{padding:6px 12px;border:1px solid #e5e7eb;background:transparent;color:#6b7280;border-radius:8px;cursor:pointer;font-size:12px}
.nav-btn:hover{background:#f3f4f6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px}
.input{width:100%;padding:9px 11px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.input:focus{border-color:#1a1a2e}
.btn{width:100%;margin-top:14px;padding:10px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.err{font-size:12px;color:#ef4444;margin-top:8px}
.hint{font-size:11px;color:#9ca3af;text-align:center;margin-top:10px}
.link-row{font-size:12px;color:#6b7280;text-align:center;margin-top:12px}
.link-row button{background:none;border:none;color:#1a1a2e;font-weight:500;font-size:12px;cursor:pointer;text-decoration:underline}
.lbl{display:block;font-size:12px;font-weight:500;margin-bottom:5px;margin-top:12px;color:#374151}
.module-content{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;min-height:220px}
.module-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e5e7eb}
.module-icon{font-size:28px}.module-title{font-size:16px;font-weight:500}.module-sub{font-size:12px;color:#6b7280;margin-top:2px}
footer{background:#fff;border-top:1px solid #e5e7eb;padding:10px 24px;font-size:11px;color:#9ca3af;text-align:center}
.toggle{width:36px;height:20px;border-radius:10px;cursor:pointer;position:relative;transition:background 140ms}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left 140ms}

/* ── Home Page ── */
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
.home-wrap{
  position:fixed;inset:0;z-index:100;
  background:#0a0e1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Syne',system-ui,sans-serif;
}
.home-wrap.fade-out{animation:homeFadeOut .55s ease forwards;}
@keyframes homeFadeOut{to{opacity:0;transform:scale(1.03);pointer-events:none}}

/* animated grid background */
.hbg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hbg svg{width:100%;height:100%;opacity:.07}
.hbg-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  animation:pulse 6s ease-in-out infinite alternate;
}
.hbg-glow.g1{width:420px;height:420px;background:#d97706;top:-100px;right:-80px;opacity:.25;animation-delay:0s}
.hbg-glow.g2{width:320px;height:320px;background:#1d4ed8;bottom:-60px;left:-60px;opacity:.2;animation-delay:2s}
.hbg-glow.g3{width:200px;height:200px;background:#d97706;bottom:30%;left:50%;opacity:.12;animation-delay:4s}
@keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.18)}}

/* floating dots */
.dots{position:absolute;inset:0;pointer-events:none}
.dot-p{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:dotFloat linear infinite}
@keyframes dotFloat{0%{opacity:0;transform:translateY(0)}10%{opacity:.5}90%{opacity:.2}100%{opacity:0;transform:translateY(-80px)}}

/* runway line */
.runway{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:2px;height:40%;
  background:linear-gradient(to top,transparent,#d97706 60%,transparent);
  opacity:.3;
}

/* content */
.home-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;padding:0 24px;text-align:center;}
.home-badge{
  font-family:'DM Sans',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;
  color:#d97706;background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.3);
  border-radius:100px;padding:5px 14px;margin-bottom:28px;
  animation:fadeUp .6s ease both;animation-delay:.1s;
}
.home-plane{font-size:42px;margin-bottom:16px;animation:fadeUp .6s ease both,planeBob 3s ease-in-out infinite;animation-delay:.2s,.8s}
@keyframes planeBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.home-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(40px,9vw,72px);font-weight:800;line-height:1;
  color:#fff;letter-spacing:-2px;
  animation:fadeUp .6s ease both;animation-delay:.3s;
}
.home-title span{color:#d97706}
.home-sub{
  font-family:'DM Sans',sans-serif;
  font-size:clamp(13px,2.5vw,16px);font-weight:300;color:#94a3b8;
  margin-top:14px;max-width:360px;line-height:1.6;
  animation:fadeUp .6s ease both;animation-delay:.45s;
}
.home-features{
  display:flex;gap:20px;margin-top:28px;flex-wrap:wrap;justify-content:center;
  animation:fadeUp .6s ease both;animation-delay:.55s;
}
.hf{display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:12px;color:#64748b;}
.hf-icon{font-size:14px}
.home-cta{
  margin-top:36px;
  padding:14px 40px;
  background:#d97706;color:#fff;
  border:none;border-radius:100px;
  font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(217,119,6,.4);
  transition:transform .15s,box-shadow .15s;
  animation:fadeUp .6s ease both;animation-delay:.65s;
}
.home-cta:hover{transform:scale(1.04);box-shadow:0 0 45px rgba(217,119,6,.6)}
.home-cta:active{transform:scale(.97)}

.home-meta{
  margin-top:20px;font-family:'DM Sans',sans-serif;font-size:11px;color:#334155;
  animation:fadeUp .6s ease both;animation-delay:.75s;
}

/* strip at bottom */
.home-strip{
  position:absolute;bottom:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,#d97706 40%,#1d4ed8 60%,transparent);
  opacity:.6;
}
/* scroll-in reveal */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<!-- ══ HOME TITLE PAGE ══ -->
<div class="home-wrap" id="home-page">
  <div class="hbg">
    <!-- subtle grid SVG -->
    <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0L0 0 0 50" fill="none" stroke="#fff" stroke-width=".6"/>
        </pattern>
      </defs>
      <rect width="800" height="600" fill="url(#grid)"/>

    <div class="hbg-glow g1"></div>

<nav>

<main><div class="dash" id="app"></div></main>
<footer>© 2026 AeroNav · Airport Wayfinding · Team 27 · HYD International</footer>
<script>
const DB={'passenger@aeronav.app':{name:'Alex Passenger',password:'board123',gate:'B24',flight:'AN-301'}};
const MODS=[
  {i:'🗺️',n:'Interactive Map',d:'Navigate terminals & gates',t:'a',key:'map'},

  {i:'➡️',n:'Route Guide',d:'Shortest path to destination',t:'l',key:'route'},

const LABELS={l:'Live',a:'Active',n:'New'};
const MODULE_CONTENT={
  map:`<p style="color:#6b7280;font-size:13px;margin-bottom:16px">Terminal T1 — Ground Floor</p>

    <div style="display:flex;flex-direction:column;gap:6px">

  route:`<p style="font-size:13px;color:#6b7280;margin-bottom:14px">Shortest path — Check-in → Security → Gate B24</p>
    <div style="display:flex;flex-direction:column;gap:0">
    ${[['Check-in Counter','Start','#1a1a2e'],['Security Checkpoint','3 min walk','#d97706'],['Terminal B Wing','2 min walk','#d97706'],['Gate B24','1 min walk','#16a34a']].map(([s,t,c],i,a)=>`<div style="display:flex;align-items:center;gap:10px"><div style="display:flex;flex-direction:column;align-items:center"><div style="width:28px;height:28px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600">${i+1}</div>${i<a.length-1?'<div style="width:2px;height:28px;background:#e5e7eb"></div>':''}</div><div style="padding:4px 0"><div style="font-size:13px;font-weight:500">${s}</div><div style="font-size:11px;color:#9ca3af">${t}</div></div></div>`).join('')}</div>`,
  floor:`<p style="font-size:13px;color:#6b7280;margin-bottom:14px">Select a floor to explore</p>
    <div style="display:flex;flex-direction:column;gap:8px">
    ${[['Floor 3','Departures Lounge & Premium Shops',false],['Floor 2','Food Court, Lounges & Restrooms',false],['Floor 1 (You are here)','Gates A–D, Security & Check-in',true],['Ground','Arrivals, Baggage & Ground Transport',false]].map(([f,d,cur])=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid ${cur?'#1a1a2e':'#e5e7eb'};border-radius:8px;cursor:pointer;background:${cur?'#f3f4f6':'#fff'}"><div><div style="font-size:13px;font-weight:500">${f}</div><div style="font-size:11px;color:#9ca3af">${d}</div></div>${cur?'<span style="font-size:10px;background:#eff6ff;color:#2563eb;padding:2px 7px;border-radius:4px">Current</span>':''}</div>`).join('')}</div>`,

// ── Home page logic ──
(function spawnDots(){
  const c=document.getElementById('dots-container');
  if(!c)return;
  for(let i=0;i<30;i++){
    const d=document.createElement('div');
    d.className='dot-p';
    d.style.left=Math.random()*100+'%';
    d.style.bottom=Math.random()*60+'%';
    const dur=4+Math.random()*6;
    d.style.animationDuration=dur+'s';
    d.style.animationDelay=Math.random()*6+'s';
    c.appendChild(d);
  }
})();

function launchApp(){
  const hp=document.getElementById('home-page');
  hp.classList.add('fade-out');
  setTimeout(()=>{hp.style.display='none';showLogin();},550);
}

let user=null,loginTime=null,timerID=null;
function initials(n){return n.trim().split(' ').slice(0,2).map(p=>p[0].toUpperCase()).join('')}
function elapsed(){const s=Math.floor((Date.now()-loginTime)/1000);return s<60?s+'s':Math.floor(s/60)+'m '+s%60+'s';}
function tog(i){const t=document.getElementById('tog'+i),k=document.getElementById('tok'+i);const on=k.style.left==='18px';k.style.left=on?'2px':'18px';t.style.background=on?'#e5e7eb':'#1a1a2e';}
function setNav(){document.getElementById('nav-btn').innerHTML=user?`<button class="nav-btn" onclick="logout()">Sign out</button>`:'';}

function showLogin(err=''){
  setNav();
  document.getElementById('app').innerHTML=`
    <div class="card" style="max-width:360px;width:100%;margin:auto">
      <p style="font-size:18px;font-weight:500;margin-bottom:2px">Sign in</p>
      <p style="font-size:12px;color:#6b7280;margin-bottom:20px">Airport Wayfinding — AeroNav</p>
      ${err?`<p class="err">${err}</p>`:''}
      <label class="lbl">Email</label><input class="input" id="em" type="email" placeholder="you@example.com"/>
      <label class="lbl">Password</label><input class="input" id="pw" type="password" placeholder="••••••••"/>
      <button class="btn" onclick="login()">Sign in</button>
      <p class="hint">Demo: passenger@aeronav.app / board123</p>
      <div class="link-row">No account? <button onclick="showRegister()">Create one</button></div>
    </div>`;
  document.getElementById('pw').addEventListener('keydown',e=>e.key==='Enter'&&login());
}

function showRegister(err=''){
  setNav();
  document.getElementById('app').innerHTML=`
    <div class="card" style="max-width:360px;width:100%;margin:auto">
      <p style="font-size:18px;font-weight:500;margin-bottom:2px">Create account</p>
      <p style="font-size:12px;color:#6b7280;margin-bottom:20px">Register to use AeroNav</p>
      ${err?`<p class="err">${err}</p>`:''}
      <label class="lbl">Full Name</label><input class="input" id="nm" type="text" placeholder="Your name"/>
      <label class="lbl">Email</label><input class="input" id="em" type="email" placeholder="you@example.com"/>
      <label class="lbl">Password</label><input class="input" id="pw" type="password" placeholder="6+ characters"/>
      <button class="btn" onclick="register()">Create account</button>
      <div class="link-row">Have an account? <button onclick="showLogin()">Sign in</button></div>
    </div>`;
}

function showModule(key){
  const m=MODS.find(x=>x.key===key);
  setNav();
  document.getElementById('app').innerHTML=`
    <div style="width:100%">
      <button class="back-btn" onclick="showDashboard()">← Back to dashboard</button>
      <div class="module-content">
        <div class="module-header">
          <span class="module-icon">${m.i}</span>
          <div><div class="module-title">${m.n}</div><div class="module-sub">${m.d}</div></div>
          <span class="tag ${m.t}" style="margin-left:auto">${LABELS[m.t]}</span>
        </div>
        ${MODULE_CONTENT[key]||'<p style="color:#9ca3af;font-size:13px">Content coming soon.</p>'}
      </div>
    </div>`;
}

function showDashboard(){
  setNav();
  if(timerID) clearInterval(timerID);
  timerID=setInterval(()=>{const el=document.getElementById('sv');if(el)el.textContent=elapsed();},1000);
  document.getElementById('app').innerHTML=`
    <div class="dash">
      <div class="panel">
        <div class="row">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="av">${initials(user.name)}</div>
            <div><div class="uname">${user.name}</div><div class="uemail">${user.email}</div></div>
          </div>
          <div class="pill"><div class="dot"></div>Active</div>
        </div>
      </div>
      <div class="panel">
        <div class="fgrid">
          <div class="fi"><div class="fl">Flight</div><div class="fv a">${user.flight}</div></div>
          <div class="fi"><div class="fl">Gate</div><div class="fv">${user.gate}</div></div>
          <div class="fi"><div class="fl">Terminal</div><div class="fv">T1 HYD</div></div>
          <div class="fi"><div class="fl">Session</div><div class="fv g" id="sv">${elapsed()}</div></div>
        </div>
      </div>
      <div class="grid3">
        ${MODS.map(m=>`<div class="mc" onclick="showModule('${m.key}')">
          <div class="mi">${m.i}</div><div class="mn">${m.n}</div><div class="md">${m.d}</div>
          <span class="tag ${m.t}">${LABELS[m.t]}</span>
        </div>`).join('')}
      </div>
      <div class="panel row">
        <span style="font-size:11px;color:#9ca3af">Hyderabad Rajiv Gandhi International</span>
        <button onclick="logout()" style="padding:6px 14px;border:1px solid #fca5a5;background:transparent;color:#ef4444;border-radius:8px;cursor:pointer;font-size:12px">Sign out</button>
      </div>
    </div>`;
}

function login(){
  const em=document.getElementById('em').value.trim();
  const pw=document.getElementById('pw').value;
  const u=DB[em.toLowerCase()];
  if(!u||u.password!==pw){showLogin('Invalid email or password.');return;}
  user={name:u.name,email:em.toLowerCase(),gate:u.gate,flight:u.flight};loginTime=Date.now();showDashboard();
}
function register(){
  const nm=document.getElementById('nm').value.trim(),em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;
  if(!nm){showRegister('Full name required.');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){showRegister('Enter a valid email.');return;}
  if(pw.length<6){showRegister('Password must be 6+ characters.');return;}
  if(DB[em.toLowerCase()]){showRegister('Account already exists.');return;}
  DB[em.toLowerCase()]={name:nm,password:pw,gate:'TBA',flight:'TBA'};
  user={name:nm,email:em.toLowerCase(),gate:'TBA',flight:'TBA'};loginTime=Date.now();showDashboard();
}
function logout(){if(timerID)clearInterval(timerID);user=null;loginTime=null;showLogin();}
</script>
</body>
</html>
